<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cinedle — guess the movie</title>
  <meta name="description" content="Guess the movie from a famous quote or a still frame." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@1,500&display=swap" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top">
    <div class="brand">CINE<span>DLE</span></div>
    <nav class="modes" role="tablist">
      <button class="mode" data-mode="quotes" role="tab">Quotes</button>
      <button class="mode" data-mode="stills" role="tab">Stills</button>
    </nav>
    <button class="icon-btn" id="settingsBtn" title="Settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>

  <main>
    <div class="controls">
      <div class="levels" id="levels">
        <button class="level" data-level="easy">Easy</button>
        <button class="level" data-level="medium">Medium</button>
        <button class="level" data-level="hard">Hard</button>
        <button class="level" data-level="impossible">Impossible</button>
      </div>
      <div class="play-type">
        <button class="pt" data-type="daily">Daily</button>
        <button class="pt" data-type="endless">Endless</button>
      </div>
    </div>

    <section id="stage"></section>

    <div class="attempts" id="attempts"></div>
    <ol class="guesses" id="guesses"></ol>

    <div class="guess-bar" id="guessBar">
      <div class="search">
        <svg class="search-ico" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="guessInput" type="text" autocomplete="off" spellcheck="false" placeholder="Know it? Search for the movie" />
        <ul class="suggestions" id="suggestions" role="listbox"></ul>
      </div>
      <div class="actions">
        <button class="btn ghost" id="skipBtn">Skip</button>
        <button class="btn primary" id="submitBtn" disabled>Submit</button>
      </div>
    </div>

    <section class="result" id="result" hidden></section>
  </main>

  <dialog id="settings">
    <form method="dialog">
      <h2>Settings</h2>
      <p class="muted">The <b>Stills</b> game pulls real frames from The Movie Database (TMDB). Paste a free TMDB API key (v3 key or v4 read token) to turn it on. It's saved only in this browser.</p>
      <label for="tmdbKey">TMDB API key</label>
      <input id="tmdbKey" type="text" spellcheck="false" placeholder="e.g. 1a2b3c4d…" />
      <p class="small muted">Get one at themoviedb.org → Settings → API. Quotes work without it.</p>
      <div class="dialog-actions">
        <button class="btn ghost" value="cancel">Close</button>
        <button class="btn primary" id="saveKey" value="save">Save</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast"></div>

  <script src="config.js"></script>
  <script src="data/quotes.js"></script>
  <script src="data/stills.js"></script>
  <script src="data/movies.js"></script>
  <script src="app.js"></script>
</body>
</html>

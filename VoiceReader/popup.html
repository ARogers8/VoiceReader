<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VoiceReader</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/icon32.png" alt="" width="24" height="24">
    <h1>VoiceReader</h1>
  </header>

  <label class="field">
    <span>Voice</span>
    <select id="voiceName"><option value="">Default voice</option></select>
  </label>

  <label class="field">
    <span>Speed <output id="rateOut"></output></span>
    <input id="rate" type="range" min="0.5" max="3" step="0.1">
  </label>

  <label class="field">
    <span>Pitch <output id="pitchOut"></output></span>
    <input id="pitch" type="range" min="0" max="2" step="0.1">
  </label>

  <label class="field">
    <span>Volume <output id="volumeOut"></output></span>
    <input id="volume" type="range" min="0" max="1" step="0.05">
  </label>

  <label class="field">
    <span>Test sentence</span>
    <textarea id="sample" rows="2">Hello! This is how VoiceReader sounds with these settings.</textarea>
  </label>

  <div class="buttons">
    <button id="test" class="primary">Play test</button>
    <button id="stop">Stop</button>
    <button id="reset" class="link">Reset to defaults</button>
  </div>

  <p class="hint">Highlight text on any page, right-click, and choose
    <strong>Read aloud with VoiceReader</strong>. Shortcuts: Alt+Shift+R to read,
    Alt+Shift+S to stop.</p>

  <script type="module" src="popup.js"></script>
</body>
</html>

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hushline"
version = "0.1.0"
description = "Hide an AES-256-GCM encrypted message inside ordinary-looking chat text."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "cryptography>=41",
]

[project.optional-dependencies]
clipboard = ["pyperclip>=1.8"]
dev = ["pytest>=7"]

[project.scripts]
hushline = "hushline.cli:main"
hushline-app = "hushline.app:main"

[tool.setuptools.packages.find]
include = ["hushline*"]
